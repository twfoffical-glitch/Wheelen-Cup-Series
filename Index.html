<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Dashboard | Standings</title>
    <style>
        :root {
            --bg-darken: #0a0a0c;
            --panel-bg: #121215;
            --border-glow: #1a1a22;
            --text-main: #e2e8f0;
            --accent-neon: #00ffcc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-darken);
            color: var(--text-main);
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1000px;
        }

        .dashboard-header {
            margin-bottom: 2rem;
            border-left: 4px solid var(--accent-neon);
            padding-left: 1rem;
        }

        .dashboard-header h1 {
            font-size: 1.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        /* Responsive Frame Wrapper */
        .frame-wrapper {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            padding-bottom: 75%; /* Controls the aspect ratio height */
            height: 0;
        }

        .frame-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>Championship Standings</h1>
        </header>

        <main class="frame-wrapper">
            <!-- ⬇️ REPLACE THE LINE BELOW WITH YOUR EXACT EMBED CODE FROM GOOGLE SHEETS ⬇️ -->
            <iframe src="https://docs.google.com/spreadsheets/d/1mdwb8l4JH6HiXogER1SdS5AbKmv_TLR-H48j2LTEOYs/edit?gid=0#gid=0"></iframe>
        </main>
    </div>

</body>
</html>
