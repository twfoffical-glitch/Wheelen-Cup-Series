<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Dashboard | Hub</title>
    <style>
        /* Modern Racing UI Aesthetic Elements */
        :root {
            --bg-darken: #0a0a0c;
            --panel-bg: #121215;
            --border-glow: #1a1a22;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --accent-neon: #00ffcc; /* Racing Cyan */
            --playoff-cut: #ff3b3b; /* Playoff Danger Red */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-darken);
            color: var(--text-main);
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1000px;
        }

        /* Header UI */
        .dashboard-header {
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--accent-neon);
            padding-left: 1rem;
        }

        .dashboard-header h1 {
            font-size: 1.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .dashboard-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        /* Tab Navigation Bar */
        .tab-navigation {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-glow);
            padding-bottom: 0.75rem;
        }

        .tab-btn {
            background: #17171c;
            border: 1px solid var(--border-glow);
            color: var(--text-muted);
            padding: 0.6rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .tab-btn:hover { color: #ffffff; border-color: var(--text-muted); }

        .tab-btn.active {
            background: var(--accent-neon);
            color: #000000;
            border-color: var(--accent-neon);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        /* View Content Management */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Standings Table Architecture */
        .table-wrapper {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #17171c;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            font-weight: 700;
            padding: 1rem;
            border-bottom: 2px solid var(--border-glow);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-glow);
            font-variant-numeric: tabular-nums;
        }

        tr:hover td { background-color: #16161c; }

        /* Dynamic Sheet Info Cards */
        .info-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            padding: 1.25rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-card h3 {
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-card p { font-size: 0.85rem; color: var(--text-muted); }

        .badge-status {
            background: #1c1c24;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-green { color: var(--accent-neon); }
        .status-red { color: var(--playoff-cut); }
        .status-gray { color: var(--text-muted); }

        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .pos-column { font-weight: 700; color: var(--text-muted); width: 60px; }
        .driver-name { font-weight: 600; color: #ffffff; }
        .team-badge { color: var(--text-muted); font-size: 0.85rem; }
        .pts-total { font-weight: 700; color: var(--accent-neon); }
        .playoff-cutline td { border-bottom: 2px dashed var(--playoff-cut); }

        .loading-state { padding: 3rem; text-align: center; color: var(--text-muted); font-style: italic; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>League Data Hub</h1>
            <p>Live Database Synchronization Active</p>
        </header>

        <!-- Four Nav Tabs Split System -->
        <nav class="tab-navigation">
            <button class="tab-btn active" onclick="switchTab('d1-standings')">D1 Standings</button>
            <button class="tab-btn" onclick="switchTab('d2-standings')">D2 Standings</button>
            <button class="tab-btn" onclick="switchTab('results')">Race Results</button>
            <button class="tab-btn" onclick="switchTab('schedule')">Schedule</button>
        </nav>

        <!-- TAB 1: D1 STANDINGS VIEW -->
        <main id="d1-standings-tab" class="tab-content active">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th class="text-center">Pos</th>
                            <th>Driver</th>
                            <th>Team</th>
                            <th class="text-center">Wins</th>
                            <th class="text-center">Top 5</th>
                            <th class="text-right">Pts</th>
                            <th class="text-right">Gap</th>
                        </tr>
                    </thead>
                    <tbody id="d1-standings-body">
                        <tr><td colspan="7" class="loading-state">Downloading Division 1 telemetry...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>

        <!-- TAB 2: D2 STANDINGS VIEW -->
        <main id="d2-standings-tab" class="tab-content">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th class="text-center">Pos</th>
                            <th>Driver</th>
                            <th>Team</th>
                            <th class="text-center">Wins</th>
                            <th class="text-center">Top 5</th>
                            <th class="text-right">Pts</th>
                            <th class="text-right">Gap</th>
                        </tr>
                    </thead>
                    <tbody id="d2-standings-body">
                        <tr><td colspan="7" class="loading-state">Downloading Division 2 telemetry...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>

        <!-- TAB 3: RACE RESULTS -->
        <main id="results-tab" class="tab-content">
            <div id="results-body"><div class="loading-state">Downloading result sheets...</div></div>
        </main>

        <!-- TAB 4: SCHEDULE -->
        <main id="schedule-tab" class="tab-content">
            <div id="schedule-body"><div class="loading-state">Downloading calendar timelines...</div></div>
        </main>
    </div>

    <script>
        const SHEET_ID = '1mdwb8l4JH6HiXogER1SdS5AbKmv_TLR-H48j2LTEOYs';

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            // Set current target active state securely
            if (event && event.target) {
                event.target.classList.add('active');
            }
            document.getElementById(`${tabId}-tab`).classList.add('active');
        }

        function getCSVUrl(tabName) {
            return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}`;
        }

        // CSV parsing engine
        function parseCSV(text) {
            const lines = text.split('\n');
            const result = [];
            if (lines.length === 0 || !lines[0].trim()) return result;
            const headers = lines[0].split(',').map(h => h.replace(/^"(.*)"$/, '$1').trim());

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const obj = {};
                const currentline = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
                headers.forEach((header, index) => {
                    let value = currentline[index] ? currentline[index].trim() : '';
                    value = value.replace(/^"(.*)"$/, '$1');
                    obj[header] = value;
                });
                result.push(obj);
            }
            return result;
        }

        function getStatusClass(status) {
            if (!status) return 'status-gray';
            const s = status.toLowerCase();
            if (s.includes('next') || s.includes('live') || s.includes('official')) return 'status-green';
            if (s.includes('canceled') || s.includes('postponed')) return 'status-red';
            return 'status-gray';
        }

        async function fetchTable(tabName, elementId) {
            try {
                const res = await fetch(getCSVUrl(tabName));
                const data = parseCSV(await res.text());
                const tbody = document.getElementById(elementId);
                tbody.innerHTML = '';
                
                const PLAYOFF_CUTOFF_LINE = 10;

                data.forEach((row, index) => {
                    const tr = document.createElement('tr');
                    if (index + 1 === PLAYOFF_CUTOFF_LINE) tr.className = 'playoff-cutline';
                    tr.innerHTML = `
                        <td class="pos-column text-center">${row.POS || (index + 1)}</td>
                        <td class="driver-name">${row.DRIVER || '—'}</td>
                        <td class="team-badge">${row.TEAM || '—'}</td>
                        <td class="text-center">${row.WINS || '0'}</td>
                        <td class="text-center">${row.TOP5 || '0'}</td>
                        <td class="pts-total text-right">${row.PTS || '0'}</td>
                        <td class="text-right" style="color: var(--text-muted); font-size: 0.85rem;">${row.GAP || '—'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch(e) { 
                document.getElementById(elementId).innerHTML = '<tr><td colspan="7" class="loading-state">Error downloading data. Verify tab structure exists.</td></tr>'; 
            }
        }

        async function loadHubData() {
            // Load Standings into individual target DOM references independently
            await fetchTable('D1-Standings', 'd1-standings-body');
            await fetchTable('D2-Standings', 'd2-standings-body');

            // FETCH & RENDER RACE RESULTS
            try {
                const res = await fetch(getCSVUrl('Results'));
                const data = parseCSV(await res.text());
                const container = document.getElementById('results-body');
                container.innerHTML = data.length === 0 ? '<div class="loading-state">No race items logged.</div>' : '';
                data.forEach(row => {
                    container.innerHTML += `
                        <div class="info-card">
                            <div>
                                <h3>${row.RACE || 'Unknown Event'}</h3>
                                <p>Winner: ${row.WINNER || '—'} • ${row.MARGIN || '—'}</p>
                            </div>
                            <span class="badge-status ${getStatusClass(row.STATUS)}">${row.STATUS || 'Completed'}</span>
                        </div>`;
                });
            } catch(e) { document.getElementById('results-body').innerHTML = '<div class="loading-state">Error sync.</div>'; }

            // FETCH & RENDER SCHEDULE
            try {
                const res = await fetch(getCSVUrl('Schedule'));
                const data = parseCSV(await res.text());
                const container = document.getElementById('schedule-body');
                container.innerHTML = data.length === 0 ? '<div class="loading-state">No schedule tracking data.</div>' : '';
                data.forEach(row => {
                    container.innerHTML += `
                        <div class="info-card">
                            <div>
                                <h3>${row.TRACK || 'TBD Track'}</h3>
                                <p>${row.DETAILS || 'Race date and parameters unlisted'}</p>
                            </div>
                            <span class="badge-status ${getStatusClass(row.STATUS)}">${row.STATUS || 'Scheduled'}</span>
                        </div>`;
                });
            } catch(e) { document.getElementById('schedule-body').innerHTML = '<div class="loading-state">Error sync.</div>'; }
        }

        window.onload = loadHubData;
    </script>
</body>
</html>
